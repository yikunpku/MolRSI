    @keyframes molrsi-infinity-travel-trail {
      from { stroke-dashoffset: -85; }
      to { stroke-dashoffset: -1085; }
    }
    @keyframes molrsi-infinity-travel-marker {
      from { stroke-dashoffset: -130; }
      to { stroke-dashoffset: -1130; }
    }
    @media (prefers-reduced-motion: reduce) {
